# Runs the full quality bar from CONSTRAINTS.md (`pnpm check:full`) on every PR and push to main.
# CONSTRAINTS.md is the source of truth for what is checked; this file only provisions the tools.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  OSV_SCANNER_VERSION: 2.7.0
  OSV_SCANNER_SHA256: 160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b
  SEMGREP_VERSION: 1.184.0
  DIFF_COVER_VERSION: 11.0.1

jobs:
  checks:
    name: check:full
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Full history: the floor guard and diff-cover diff against origin/main, and gitleaks scans history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # pnpm version comes from package.json "packageManager".
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev

      # Toolchain and components come from rust-toolchain.toml.
      - name: Rust toolchain
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-llvm-cov

      - name: Scanners (pinned, checksum-verified)
        run: |
          pipx install "semgrep==${SEMGREP_VERSION}"
          pipx install "diff-cover==${DIFF_COVER_VERSION}"
          cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks && sudo install gitleaks /usr/local/bin/
          curl -sSfL -o osv-scanner "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  osv-scanner" | sha256sum -c -
          sudo install osv-scanner /usr/local/bin/

      - name: Chromium for the accessibility check
        run: pnpm exec playwright install --with-deps chromium

      - name: pnpm check:full
        run: pnpm check:full
